name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check direct pins are present in runtime lock
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          pin_pattern = re.compile(
              r"^([A-Za-z0-9_.-]+)(?:\[[^\]]+\])?\s*==\s*([^\s;]+)"
          )

          def pinned_dependencies(path):
              result = {}
              for raw_line in Path(path).read_text().splitlines():
                  line = raw_line.partition("#")[0].strip()
                  if not line:
                      continue
                  match = pin_pattern.match(line)
                  if match:
                      name = re.sub(r"[-_.]+", "-", match.group(1)).lower()
                      result[name] = match.group(2)
              return result

          source = pinned_dependencies("requirements.in")
          lock = pinned_dependencies("requirements.txt")
          mismatched = {
              name: {"source": version, "lock": lock.get(name)}
              for name, version in source.items()
              if lock.get(name) != version
          }
          if mismatched:
              raise SystemExit(f"Runtime lock is out of sync with requirements.in: {mismatched}")
          print(f"All {len(source)} direct runtime pins are present in requirements.txt.")
          PY

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -q

      - name: Compile and check shell syntax
        run: |
          python -m compileall -q mirrorbot scripts
          bash -n start.sh

      - name: Audit locked dependencies
        run: python -m pip_audit -r requirements.txt

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Build runtime image
        run: docker build --tag mirror-bot-ci .

      - name: Smoke-test runtime tools
        run: |
          docker run --rm --entrypoint deno mirror-bot-ci --version
          docker run --rm mirror-bot-ci python -c "import aiohttp, boto3, pyrogram, yt_dlp"

services:
  bot:
    build: .
    container_name: mirror-bot
    restart: unless-stopped
    stop_grace_period: 40s
    env_file:
      - .env
    ports:
      # Torrent selector
      - "8001:8001"
      # Google Drive search pages
      - "8002:8002"
      # Temporary Google Drive share pages
      - "8003:8003"
    volumes:
      - ./data/downloads:/app/downloads
      - ./data/logs:/app/logs
      - ./credentials.json:/app/data/google/credentials.json:ro
      - ./token.pickle:/app/data/google/token.pickle
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
